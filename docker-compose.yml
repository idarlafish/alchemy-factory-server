services:
  alchemy-factory:
    image: idarlafish/alchemy-factory-server:latest
    container_name: alchemy-factory-server
    restart: unless-stopped
    environment:
      TZ: Europe/Riga
      SERVER_PASSWORD: change-me
      ADMIN_PASSWORD: change-me-too
      # Any config key, including ones added after this image shipped:
      # CFG_some_new_key: "value"
    volumes:
      - ./data:/data
