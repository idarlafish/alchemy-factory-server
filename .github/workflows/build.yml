name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only changes must not publish a new image.
    paths:
      - "Dockerfile"
      - ".hadolint.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Game auto-updates; rebuild weekly so the published image stays current.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S style -x scripts/*.sh scripts/joincode tests/*.sh

      - name: tests
        run: for t in tests/test-*.sh; do echo "== $t"; "$t"; done
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USER }}/alchemy-factory-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      # amd64 only: the server is a Windows x86-64 binary under Proton.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes an image for a pull request so it can be tested before merging.
  # Opt in with the build-image label, so unrelated pull requests are not left with a
  # pending deployment. Then the dev-image environment asks for approval on the PR page.
  # Fork pull requests get no secrets, so it is limited to branches in this repo.
  publish-pr:
    needs: lint
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'build-image')
    runs-on: ubuntu-latest
    environment: dev-image
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/alchemy-factory-server
          tags: type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Pushed ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
