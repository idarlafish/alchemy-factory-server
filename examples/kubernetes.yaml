# Minimal Kubernetes example. With runAsUser set the root phase is skipped and
# fsGroup grants access to the volume; without it the entrypoint starts as root
# and applies PUID/PGID itself.
---
apiVersion: v1
kind: Secret
metadata:
  name: alchemy-factory
stringData:
  serverPassword: change-me
  adminPassword: change-me-too
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alchemy-factory
spec:
  selector:
    matchLabels:
      app: alchemy-factory
  serviceName: alchemy-factory
  replicas: 1
  template:
    metadata:
      labels:
        app: alchemy-factory
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alchemy-factory
          image: idarlafish/alchemy-factory-server:latest
          env:
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef: { name: alchemy-factory, key: serverPassword }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: alchemy-factory, key: adminPassword }
          # Only needed with SERVER_RELAY=0, plus a Service to match.
          # ports:
          #   - { name: game, containerPort: 9877, protocol: UDP }
          #   - { name: query, containerPort: 9878, protocol: UDP }
          resources:
            requests:
              cpu: "500m"
              memory: 3Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
